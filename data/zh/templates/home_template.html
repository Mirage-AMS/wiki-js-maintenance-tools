<div id="wiki-portal">
    <!-- 页面头部区域 -->
    <div class="portal-header">
        <div class="header-content">
            <div class="portal-title">欢迎踏上《传奇之路》</div>
            <div class="portal-description">了解规则、卡牌和项目讯息</div>
        </div>
    </div>

    <!-- 统计概览区域 -->
    <div class="stats-overview">
        <div class="stat-card">
            <div class="stat-value" id="total-categories">0</div>
            <div class="stat-label">分类总数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="total-items">0</div>
            <div class="stat-label">知识条目</div>
        </div>
    </div>

    <!-- 近期更新区域 -->
    <div id="recent-updates-section">
        <!-- 新增：自定义标题栏 -->
        <div class="section-header">
            <div class="section-icon update-icon"></div>
            <div class="section-title">更新</div>
            <div class="section-divider"></div>
        </div>
        <div class="recent-updates" id="recent-updates-container">
            <!-- 近期更新条目将通过JavaScript动态生成 -->
        </div>
    </div>

    <!-- 分类目录区域 -->
    <div id="category-catalog">
        <!-- 新增：自定义标题栏 -->
        <div class="section-header">
            <div class="section-icon category-icon"></div>
            <div class="section-title">内容</div>
            <div class="section-divider"></div>
        </div>
        <div class="category-grid" id="category-container">
            <!-- 分类条目将通过JavaScript动态生成 -->
        </div>
    </div>

    <!-- 外链跳转区域 -->
    <div id="external-links-section">
        <!-- 新增：自定义标题栏 -->
        <div class="section-header">
            <div class="section-icon link-icon"></div>
            <div class="section-title">导航</div>
            <div class="section-divider"></div>
        </div>
        <div class="external-links" id="external-links-container">
            <!-- 外链内容卡将通过JavaScript动态生成 -->
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 全局变量
        let categoryData = [];
        let externalLinksData = [];
        let recentUpdatesData = []; // 新增：近期更新数据

        // DOM 元素
        let categoryContainer = null;
        let externalLinksContainer = null;
        let recentUpdatesContainer = null; // 新增：近期更新容器

        // 统计数据元素
        let totalCategoriesEl = null;
        let totalItemsEl = null;

        // 初始化 - 等待DOM元素加载完成
        function init() {
            // 获取DOM元素
            categoryContainer = document.getElementById('category-container');
            externalLinksContainer = document.getElementById('external-links-container');
            recentUpdatesContainer = document.getElementById('recent-updates-container'); // 新增：获取更新容器

            // 统计元素
            totalCategoriesEl = document.getElementById('total-categories');
            totalItemsEl = document.getElementById('total-items');

            // 检查必要元素是否已加载
            if (categoryContainer && recentUpdatesContainer) { // 新增：检查更新容器
                loadCategoryData();
            } else {
                // 元素未加载完成，继续轮询
                setTimeout(init, 100);
            }
        }

        // 加载分类数据
        function loadCategoryData() {
            // 显示加载状态
            categoryContainer.innerHTML = '<p class="loading">加载分类数据中...</p>';
            recentUpdatesContainer.innerHTML = '<p class="loading">加载更新数据中...</p>'; // 新增：更新加载状态

            // 加载分类数据
            fetch('/assets/json/{{ contents.filename }}')
                .then(response => {
                    if (!response.ok) throw new Error('网络响应不正常');
                    return response.json();
                })
                .then(data => {
                    categoryData = data.contents.data;
                    externalLinksData = data.contents.externalLinks || [];
                    recentUpdatesData = data.contents.recentUpdates || []; // 新增：读取更新数据
                    renderCategories();
                    renderExternalLinks();
                    renderRecentUpdates(); // 新增：渲染更新内容
                    updateStats();
                })
                .catch(error => {
                    console.error('加载数据时出错:', error);
                    categoryContainer.innerHTML = '<p class="error">加载分类数据失败，请稍后重试</p>';
                    recentUpdatesContainer.innerHTML = '<p class="error">加载更新数据失败，请稍后重试</p>'; // 新增：更新错误状态
                });
        }

        // 渲染分类条目
        function renderCategories() {
            categoryContainer.innerHTML = '';

            if (categoryData.length === 0) {
                categoryContainer.innerHTML = '<p class="no-categories">没有找到分类数据</p>';
                return;
            }

            categoryData.forEach(category => {
                const categoryElement = document.createElement('div');
                // 使用分类的颜色作为样式，如果没有指定则使用默认颜色
                const categoryColor = category.color || '#3498db';
                categoryElement.className = 'category-item';
                // 设置左侧边框颜色
                categoryElement.style.borderLeftColor = categoryColor;

                // 构建分类条目内容
                categoryElement.innerHTML = `
                    <div class="category-info">
                        <h3 class="category-name">${category.title}</h3>
                        <p class="category-description">${category.description || '暂无描述'}</p>
                        <div class="category-meta">
                            <span class="item-count" style="background-color: ${hexToRgba(categoryColor, 0.1)}; color: ${categoryColor}">
                                包含 ${category.itemCount || 0} 个条目
                            </span>
                        </div>
                    </div>
                `;

                // 点击跳转
                categoryElement.addEventListener('click', () => {
                    window.location.href = category.path;
                });

                categoryContainer.appendChild(categoryElement);
            });
        }

        // 渲染外部链接卡
        function renderExternalLinks() {
            externalLinksContainer.innerHTML = '';

            if (externalLinksData.length === 0) {
                externalLinksContainer.innerHTML = '<p class="no-links">没有外部链接数据</p>';
                return;
            }

            externalLinksData.forEach(link => {
                const linkElement = document.createElement('div');
                // 为无链接的项添加特殊类名
                const cardClass = link.url ? 'external-link-card' : 'external-link-card disabled';
                linkElement.className = cardClass;

                linkElement.innerHTML = `
                    <!-- 缩略图区域 -->
                    <div class="link-thumbnail">
                        <img src="${link.thumbnail}" alt="${link.title}缩略图"
                             onerror="this.src='/assets/thumbnail/default.jpg'">
                    </div>
                    <!-- 信息区域 -->
                    <div class="link-info">
                        <h3 class="link-title">${link.title}</h3>
                        <p class="link-description">${link.description || '无描述'}</p>
                        ${link.url ? `<div class="link-domain">${new URL(link.url).hostname}</div>` : ''}
                    </div>
                    <!-- 链接图标（仅当有链接时显示） -->
                    ${link.url ? `
                    <div class="link-icon">
                        <i class="icon-external"></i>
                    </div>
                    ` : ''}
                `;

                // 只有当url存在时才添加跳转事件
                if (link.url) {
                    linkElement.addEventListener('click', () => {
                        window.open(link.url, '_blank');
                    });
                }

                externalLinksContainer.appendChild(linkElement);
            });
        }

        // 新增：渲染近期更新条目
        function renderRecentUpdates() {
            recentUpdatesContainer.innerHTML = '';

            if (recentUpdatesData.length === 0) {
                recentUpdatesContainer.innerHTML = '<p class="no-updates">暂无近期更新记录</p>';
                return;
            }

            // 按日期倒序排序（最新的在前），并只取前3条
            const sortedUpdates = [...recentUpdatesData]
                .sort((a, b) => new Date(b.date) - new Date(a.date))
                .slice(0, 3); // 关键修改：只显示最近3个更新

            // 预设3种固定颜色
            const presetColors = ['#e74c3c', '#e67e22', '#f1c40f'];
            sortedUpdates.forEach((update, index) => {
                const updateElement = document.createElement('div');
                const updateColor = presetColors[index];
                updateElement.className = update.link ? 'update-item has-link' : 'update-item';
                updateElement.style.borderLeftColor = updateColor;

                // 格式化日期为友好显示
                const formattedDate = new Date(update.date).toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                // 构建更新条目内容
                updateElement.innerHTML = `
                    <div class="update-header">
                        <div class="update-date" style="color: ${hexToRgba(updateColor, 0.8)}">
                            ${formattedDate}
                        </div>
                        <h3 class="update-title">${update.title}</h3>
                    </div>
                    <div class="update-description">${update.description || '无更新描述'}</div>
                    ${update.category ? `
                        <div class="update-category" style="background-color: ${hexToRgba(updateColor, 0.1)}; color: ${updateColor}">
                            ${update.category}
                        </div>
                    ` : ''}
                `;

                // 有链接则添加跳转事件
                if (update.link) {
                    updateElement.addEventListener('click', () => {
                        window.location.href = update.link;
                    });
                }

                recentUpdatesContainer.appendChild(updateElement);
            });
        }

        // 更新统计数据
        function updateStats() {
            // 计算总条目数
            const totalItems = categoryData.reduce((sum, category) => sum + (category.itemCount || 0), 0);

            // 更新显示
            totalCategoriesEl.textContent = categoryData.length;
            totalItemsEl.textContent = totalItems;
        }

        // 辅助函数：将十六进制颜色转换为带透明度的RGBA
        function hexToRgba(hex, alpha) {
            // 移除#号
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // 启动初始化流程
        init();
    });
</script>
