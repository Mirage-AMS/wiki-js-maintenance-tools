<div id="category-catalog">
    <!-- 分类条目展示区域 -->
    <div class="category-grid" id="category-container">
        <!-- 分类条目将通过JavaScript动态生成 -->
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 全局变量
    let categoryData = [];

    // DOM 元素
    let categoryContainer = null;

    // 初始化 - 等待DOM元素加载完成
    function init() {
        // 获取DOM元素
        categoryContainer = document.getElementById('category-container');

        // 检查必要元素是否已加载
        if (categoryContainer) {
            loadCategoryData();
        } else {
            // 元素未加载完成，继续轮询
            setTimeout(init, 100);
        }
    }

    // 从JSON文件加载数据
    function loadCategoryData() {
        categoryContainer.innerHTML = '<p class="loading">加载分类数据中...</p>';

        fetch('/assets/json/{{ contents.filename }}')
            .then(response => {
                if (!response.ok) throw new Error('网络响应不正常');
                return response.json();
            })
            .then(data => {
                categoryData = data.contents.data;
                renderCategories();
            })
            .catch(error => {
                console.error('加载数据时出错:', error);
                categoryContainer.innerHTML = '<p class="error">加载分类数据失败，请稍后重试</p>';
            });
    }

    // 渲染分类条目
    function renderCategories() {
        categoryContainer.innerHTML = '';

        if (categoryData.length === 0) {
            categoryContainer.innerHTML = '<p class="no-categories">没有找到分类数据</p>';
            return;
        }

        categoryData.forEach(category => {
            const categoryElement = document.createElement('div');
            // 使用分类的颜色作为样式，如果没有指定则使用默认颜色
            const categoryColor = category.color || '#3498db';
            categoryElement.className = 'category-item';
            // 设置左侧边框颜色
            categoryElement.style.borderLeftColor = categoryColor;

            // 构建分类条目内容
            categoryElement.innerHTML = `
                <div class="category-info">
                    <h2 class="category-name">${category.title}</h2>
                    <p class="category-description">${category.description || '暂无描述'}</p>
                    <div class="category-meta">
                        <span class="item-count" style="background-color: ${hexToRgba(categoryColor, 0.1)}; color: ${categoryColor}">
                            包含 ${category.itemCount || 0} 个条目
                        </span>
                    </div>
                </div>
<!--                <div class="category-color-indicator" style="background-color: ${categoryColor}"></div>-->
            `;

            // 点击跳转
            categoryElement.addEventListener('click', () => {
                window.location.href = category.path;
            });

            categoryContainer.appendChild(categoryElement);
        });
    }

    // 辅助函数：将十六进制颜色转换为带透明度的RGBA
    function hexToRgba(hex, alpha) {
        // 移除#号
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // 启动初始化流程
    init();
});
</script>

<style>
    #category-catalog {
        max-width: 1200px;
        margin: 0 auto;
        padding: 30px 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
        background-color: #f9f9f9;
        border-radius: 8px;
        margin-top: 20px;
        margin-bottom: 40px;
    }

    .catalog-header {
        text-align: center;
        margin-bottom: 40px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
    }

    .catalog-header h1 {
        color: #2c3e50;
        font-size: 2.2rem;
        margin-bottom: 10px;
    }

    .catalog-header p {
        color: #7f8c8d;
        font-size: 1.1rem;
    }

    .category-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 25px;
    }

    .category-item {
        background-color: #fff;
        border-radius: 8px;
        padding: 25px;
        box-shadow: 0 3px 6px rgba(0,0,0,.1);
        transition: all 0.3s ease;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 4px solid #3498db; /* 默认颜色 */
    }

    .category-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 15px rgba(0,0,0,.1);
        /* 悬停时保持原有颜色的深色版本 */
        filter: brightness(0.9);
    }

    .category-info {
        flex: 1;
        padding-right: 20px;
    }

    .category-name {
        font-size: 1.4rem;
        color: #2c3e50;
        margin-bottom: 8px; /* 减小与描述的距离 */
        font-weight: 600;
    }

    .category-description {
        color: #7f8c8d;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 20px; /* 增大与条目数的距离 */
    }

    .category-meta {
        display: flex;
        align-items: center;
        margin-top: 20px;
    }

    .item-count {
        font-size: 0.85rem;
        padding: 4px 10px;
        border-radius: 12px;
    }

    /* 颜色指示器 - 替代原来的图标 */
    .category-color-indicator {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    /* 状态样式 */
    .loading, .error, .no-categories {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        color: #7f8c8d;
        font-size: 1.1rem;
    }

    .loading {
        color: #3498db;
    }

    .error {
        color: #e74c3c;
    }

    /* 响应式调整 */
    @media (max-width: 1200px) {
        .category-grid {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }
    }

    @media (max-width: 768px) {
        .category-grid {
            grid-template-columns: 1fr;
        }

        .category-item {
            flex-direction: column;
            text-align: center;
        }

        .category-info {
            padding-right: 0;
            margin-bottom: 20px;
        }

        .category-meta {
            justify-content: center;
        }
    }

    @media (max-width: 480px) {
        .catalog-header h1 {
            font-size: 1.8rem;
        }

        .category-name {
            font-size: 1.2rem;
        }
    }
</style>
